name: CI

on:
  pull_request:
  push:
    branches:
      - main

# Cancel in-progress runs for the same branch/PR to avoid wasting CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.22.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Run lint
        run: npm run lint

      - name: Run strict TypeScript checks
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Verify distributable package
        run: npm run verify:package

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Build image against production n8n version
        run: docker build --build-arg N8N_IMAGE=docker.io/n8nio/n8n:2.40.6 -t n8n-tavio-crm:ci .

      - name: Smoke test node v3 in n8n image
        run: >-
          docker run --rm --entrypoint node n8n-tavio-crm:ci -e
          "const pkg=require('/usr/local/lib/node_modules/n8n/node_modules/n8n-nodes-tavio-crm/package.json');
          const {TavioCrm}=require('/usr/local/lib/node_modules/n8n/node_modules/n8n-nodes-tavio-crm/dist/nodes/TavioCrm/TavioCrm.node.js');
          const node=new TavioCrm();
          if(pkg.version!=='0.2.2'||node.description.defaultVersion!==3)process.exit(1);
          console.log('n8n '+require('/usr/local/lib/node_modules/n8n/package.json').version+'; node '+pkg.version+'; v3 ok');"
